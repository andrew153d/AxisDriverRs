[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "axis"
version = "2.0.0"
description = "Host library for the Axis Driver stepper motor controller"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    # Must be at least the version of protoc that generated axis_pb2.py.
    "protobuf>=6.30.2",
]

[tool.setuptools]
packages = ["axis"]
