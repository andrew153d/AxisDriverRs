[package]
name = "fw"
version = "0.1.0"
edition = "2021"

[dependencies]
atsamd-hal = { version = "0.23.4", features = ["samd51j-rt", "usb"] }
axis-core = { path = "../core" }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
log = "0.4.22"
panic-halt = "1.0.0"
rtt-target = "0.6.1"
tmc2209 = "0.3.0"
usb-device = "0.3.2"
usbd-serial = "0.2.2"

[[bin]]
name = "fw"
path = "src/main.rs"
test = false
bench = false
